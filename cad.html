<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CAD Portfolio</title>
<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    padding: 2rem;
}
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}
.card {
    background: white;
    padding: 1rem;
    border-radius: 8px;
}
img {
    width: 100%;
    border-radius: 4px;
}
a {
    display: inline-block;
    margin-top: 8px;
    color: #0077cc;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>CAD Portfolio</h1>

<div class="grid">

    <div class="card">
        <img src="adap1.png">
        <h3>Adapter Design</h3>
        <a href="adapter1.pdf" target="_blank">View PDF</a>
    </div>

    <div class="card">
        <img src="conn1.png">
        <h3>Connector Pin</h3>
        <a href="conn_1.pdf" target="_blank">View PDF</a>
    </div>

</div>

</body>
</html>
